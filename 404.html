<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#101014">
  <meta name="robots" content="noindex">
  <title>Nothing at this gate — Blackshield Company</title>
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="section">
    <div class="wrap" style="min-height:78vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1.1rem">
      <span class="knight knight-error knight-once" style="--k:6"><img src="/assets/img/knight/error.png" width="128" height="28" alt="The Blackshield knight, staggering" decoding="async"></span>
      <p class="eyebrow">Error 404</p>
      <h1 style="font-size:clamp(2.2rem,6vw,4rem);margin:0">Nothing at this gate.</h1>
      <p style="max-width:46ch;margin:0;opacity:.85">The page you sought was never built, or it has moved on. Turn back; the company still holds the keep.</p>
      <p style="margin:.5rem 0 0"><a class="btn" href="/">Return to the keep</a></p>
    </div>
  </main>
  <button type="button" class="corner-knight" data-knight-base="/assets/img/knight/" aria-label="The Blackshield knight, the company mascot. Press for a sword swing."><span class="knight knight-idle"><img src="/assets/img/knight/idle.png" width="128" height="28" alt="" decoding="async"></span></button>
  <script src="/assets/knight.js" defer></script>
</body>
</html>
